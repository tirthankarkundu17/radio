<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#141726" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>

    <!-- Vibrant Brand Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="140" fill="#9d4edd" opacity="0.18" filter="url(#subtleGlow)" />
  <circle cx="210" cy="210" r="100" fill="#00f0ff" opacity="0.15" filter="url(#subtleGlow)" />

  <!-- Radio Broadcast Waves (Concentric Arcs) -->
  <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round" filter="url(#neonGlow)">
    <path d="M 120 180 A 180 180 0 0 0 120 332" stroke-width="18" opacity="0.45" />
    <path d="M 392 180 A 180 180 0 0 1 392 332" stroke-width="18" opacity="0.45" />
    <path d="M 160 205 A 120 120 0 0 0 160 307" stroke-width="22" opacity="0.8" />
    <path d="M 352 205 A 120 120 0 0 1 352 307" stroke-width="22" opacity="0.8" />
  </g>

  <!-- Center Soundwave / Neuro Pulse "N" Mark -->
  <g fill="url(#waveGrad)" filter="url(#neonGlow)">
    <rect x="204" y="210" width="20" height="92" rx="10" />
    <rect x="236" y="152" width="20" height="208" rx="10" />
    <rect x="268" y="128" width="20" height="256" rx="10" />
    <rect x="300" y="184" width="20" height="144" rx="10" />
  </g>

  <!-- Center Core Antenna Dot -->
  <circle cx="256" cy="406" r="10" fill="#00f0ff" filter="url(#neonGlow)" />
</svg>

